<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>特典会帳 · Support</title>
<style>
  :root { --bg: #ffffff; --text: #1d1d1f; --line: #d2d2d7; --button: #f5f5f7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000000; --text: #f5f5f7; --line: #3a3a3c; --button: #1c1c1e; }
  }
  body { background: var(--bg); color: var(--text); margin: 0;
         font: 20px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", "PingFang TC", "Hiragino Sans", "Helvetica Neue", sans-serif; }
  main { min-height: 100vh; min-height: 100svh; box-sizing: border-box; padding: 32px 16px;
         display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px; }
  a { display: block; box-sizing: border-box; width: 100%; max-width: 320px; padding: 16px;
      border: 1px solid var(--line); border-radius: 14px; background: var(--button);
      color: var(--text); text-align: center; text-decoration: none; }
  a:hover, a:focus-visible { border-color: var(--text); }
</style>
</head>
